# FastAPI's Depends()/Query() in argument defaults is the framework's normal idiom.
[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.auth.require_role"]

# ml/train.py is the frozen script that produced models/*.json; it is left exactly as run.
[lint.per-file-ignores]
"ml/train.py" = ["E401", "I001", "SIM115"]
"tests/conftest.py" = ["E402"]
